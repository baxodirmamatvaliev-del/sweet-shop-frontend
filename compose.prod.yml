services:
  backend:
    build:
      context: ../sweet-shop-backend
      dockerfile: ../sweet-shop-frontend/deploy/backend.Dockerfile
    env_file:
      - ../sweet-shop-backend/.env
    environment:
      CLIENT_URLS: ${CLIENT_URLS:-http://72.60.42.107:8080}
    volumes:
      - ../sweet-shop-backend/public/uploads:/app/public/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
